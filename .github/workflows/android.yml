
package za.co.idt.reminders

import android.Manifest
import android.app.*
import android.content.*
import android.content.pm.PackageManager
import android.graphics.Color
import android.net.Uri
import android.os.Build
import android.os.Bundle
import android.text.InputType
import android.widget.*
import androidx.activity.ComponentActivity
import org.json.JSONArray
import org.json.JSONObject
import java.text.SimpleDateFormat
import java.util.*

data class Job(
    val id: String = UUID.randomUUID().toString(),
    val client: String,
    val phone: String,
    val item: String,
    val address: String,
    val date: String,
    val time: String,
    val type: String,
    val notes: String = "",
    val followDate: String = "",
    val followTime: String = "09:00"
) {
    fun json(): JSONObject {
        return JSONObject()
            .put("id", id)
            .put("client", client)
            .put("phone", phone)
            .put("item", item)
            .put("address", address)
            .put("date", date)
            .put("time", time)
            .put("type", type)
            .put("notes", notes)
            .put("followDate", followDate)
            .put("followTime", followTime)
    }

    companion object {
        fun from(j: JSONObject): Job {
            return Job(
                id = j.optString("id", UUID.randomUUID().toString()),
                client = j.optString("client"),
                phone = j.optString("phone"),
                item = j.optString("item"),
                address = j.optString("address"),
                date = j.optString("date"),
                time = j.optString("time"),
                type = j.optString("type"),
                notes = j.optString("notes"),
                followDate = j.optString("followDate"),
                followTime = j.optString("followTime", "09:00")
            )
        }
    }
}

class MainActivity : ComponentActivity() {

    private val green = Color.rgb(140, 255, 0)
    private val orange = Color.rgb(255, 138, 0)
    private val dark = Color.rgb(16, 18, 18)
    private val panel = Color.rgb(32, 37, 34)

    private lateinit var root: LinearLayout
    private val jobs = mutableListOf<Job>()

    override fun onCreate(savedInstanceState: Bundle?) {
        super.onCreate(savedInstanceState)

        val saved = getSharedPreferences("idt", MODE_PRIVATE)
            .getString("jobs", "[]")

        val array = JSONArray(saved)

        for (i in 0 until array.length()) {
            jobs.add(Job.from(array.getJSONObject(i)))
        }

        createNotificationChannel()

        if (
            Build.VERSION.SDK_INT >= 33 &&
            checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS)
            != PackageManager.PERMISSION_GRANTED
        ) {
            requestPermissions(
                arrayOf(Manifest.permission.POST_NOTIFICATIONS),
                1
            )
        }

        home()
    }

    private fun createNotificationChannel() {
        if (Build.VERSION.SDK_INT >= 26) {
            val manager =
                getSystemService(NotificationManager::class.java)

            val channel = NotificationChannel(
                "idt_dates",
                "IDT Reminders",
                NotificationManager.IMPORTANCE_HIGH
            )

            manager.createNotificationChannel(channel)
        }
    }

    private fun saveJobs() {
        val array = JSONArray()

        jobs.forEach {
            array.put(it.json())
        }

        getSharedPreferences("idt", MODE_PRIVATE)
            .edit()
            .putString("jobs", array.toString())
            .apply()
    }

    private fun page(title: String) {
        val scroll = ScrollView(this)

        root = LinearLayout(this).apply {
            orientation = LinearLayout.VERTICAL
            setPadding(22, 20, 22, 35)
            setBackgroundColor(dark)
        }

        scroll.addView(root)
        setContentView(scroll)

        label("I.D.T. STEELWORKS & ENGINEERING", 21, green, true)
        label("CLIENT REMINDER SYSTEM", 12, orange, true)
        label(title, 20, Color.WHITE, true)
    }

    private fun label(
        text: String,
        size: Int,
        colour: Int,
        bold: Boolean = false
    ) {
        root.addView(
            TextView(this).apply {
                this.text = text
                textSize = size.toFloat()
                setTextColor(colour)

                if (bold) {
                    setTypeface(null, android.graphics.Typeface.BOLD)
                }

                setPadding(0, 8, 0, 8)
            }
        )
    }

    private fun btn(text: String, action: () -> Unit) {
        root.addView(
            Button(this).apply {
                this.text = text
                setTextColor(Color.BLACK)
                setBackgroundColor(green)
                setOnClickListener {
                    action()
                }
            }
        )
    }

    private fun field(
        title: String,
        hintText: String = "",
        inputTypeValue: Int = InputType.TYPE_CLASS_TEXT,
        value: String = ""
    ): EditText {

        label(title, 12, orange, true)

        return EditText(this).apply {
            hint = hintText
            setText(value)
            inputType = inputTypeValue
            setTextColor(Color.WHITE)
            setHintTextColor(Color.GRAY)
            setSingleLine()
            setPadding(12, 8, 12, 8)
            setBackgroundColor(panel)

            root.addView(this)
        }
    }

    private fun home() {
        page("Dashboard")

        label(
            "Installation bookings and collection notifications.",
            14,
            Color.LTGRAY
        )

        btn("＋ NEW INSTALLATION") {
            form("Installation")
        }

        btn("＋ READY FOR COLLECTION") {
            form("Collection")
        }

        btn("📆 CALENDAR / UPCOMING") {
            calendar()
        }

        btn("📋 ALL SAVED REMINDERS") {
            records()
        }

        label("UPCOMING", 14, green, true)

        jobs.sortedBy { it.date + it.time }
            .take(5)
            .forEach {
                label(
                    "${it.date} ${it.time} · ${it.client} · ${it.type}",
                    13,
                    Color.WHITE
                )
            }

        label("Saved: ${jobs.size}", 13, orange)
    }

    private fun form(type: String, old: Job? = null) {

        page(
            if (old == null) "New $type"
            else "Edit ${old.type}"
        )

        val client = field(
            "CLIENT NAME",
            "Client/company",
            value = old?.client ?: ""
        )

        val phone = field(
            "WHATSAPP NUMBER",
            "27821234567",
            InputType.TYPE_CLASS_PHONE,
            old?.phone ?: ""
        )

        val item = field(
            "ITEM / PROJECT",
            "Gate, balustrade",
            value = old?.item ?: ""
        )

        val address = field(
            "ADDRESS",
            "Installation address",
            value = old?.address ?: ""
        )

        val date = field(
            "DATE (YYYY-MM-DD)",
            "2026-11-20",
            value = old?.date ?: ""
        )

        val time = field(
            "TIME (HH:MM)",
            "09:00",
            value = old?.time ?: "09:00"
        )

        val notes = field(
            "NOTES",
            "Optional",
            value = old?.notes ?: ""
        )

        val followDate = field(
            "COLLECTION FOLLOW-UP DATE (OPTIONAL)",
            "YYYY-MM-DD",
            value = old?.followDate ?: ""
        )

        val followTime = field(
            "FOLLOW-UP TIME",
            "09:00",
            value = old?.followTime ?: "09:00"
        )

        fun saveAnd(openWhatsApp: Boolean) {

            if (
                client.text.isBlank() ||
                phone.text.isBlank()
            ) {
                toast("Client name and WhatsApp number required")
                return
            }

            val job = Job(
                id = old?.id ?: UUID.randomUUID().toString(),
                client = client.text.toString(),
                phone = phone.text.toString()
                    .replace("+", "")
                    .replace(" ", ""),
                item = item.text.toString(),
                address = address.text.toString(),
                date = date.text.toString(),
                time = time.text.toString(),
                type = type,
                notes = notes.text.toString(),
                followDate = followDate.text.toString(),
                followTime = followTime.text.toString()
            )

            if (old != null) {
                jobs.removeAll { it.id == old.id }
            }

            jobs.add(0, job)
            saveJobs()

            scheduleReminder(
                job,
                job.date,
                job.time,
                24,
                "Installation tomorrow",
                "${job.client} · ${job.item}"
            )

            if (job.followDate.isNotBlank()) {
                scheduleReminder(
                    job,
                    job.followDate,
                    job.followTime,
                    0,
                    "Collection follow-up",
                    "Contact ${job.client} about ${job.item}"
                )
            }

            if (openWhatsApp) {
                whatsapp(job)
            }

            home()
        }

        btn("SAVE & DRAFT WHATSAPP") {
            saveAnd(true)
        }

        btn("SAVE ONLY") {
            saveAnd(false)
        }

        btn("BACK") {
            home()
        }
    }

    private fun records() {
        page("Saved Reminders")

        if (jobs.isEmpty()) {
            label("No saved records.", 14, Color.LTGRAY)
        }

        val savedRecords = jobs.toList()

        savedRecords.forEach { job ->

            label(
                "${job.type.uppercase()} · ${job.client}",
                16,
                green,
                true
            )

            label(
                "${job.item}\n" +
                "${job.date} ${job.time}\n" +
                "${job.phone}\n" +
                "Collection follow-up: " +
                job.followDate.ifBlank { "None" } +
                "\nNotes: ${job.notes}",
                13,
                Color.WHITE
            )

            btn("EDIT") {
                form(job.type, job)
            }

            btn("DRAFT WHATSAPP") {
                whatsapp(job)
            }

            btn("DELETE") {

                AlertDialog.Builder(this)
                    .setTitle("Delete reminder?")
                    .setMessage(
                        "Delete the reminder for ${job.client}?"
                    )
                    .setNegativeButton("CANCEL", null)
                    .setPositiveButton("DELETE") { _, _ ->

                        jobs.removeAll {
                            it.id == job.id
                        }

                        saveJobs()
                        records()
                    }
                    .show()
            }
        }

        btn("BACK") {
            home()
        }
    }

    private fun calendar() {
        page("Upcoming Calendar")

        val sorted = jobs.sortedBy {
            it.date + " " + it.time
        }

        if (sorted.isEmpty()) {
            label("Nothing scheduled.", 14, Color.LTGRAY)
        }

        sorted.forEach { job ->

            label(
                "📅 ${job.date} · ${job.time}",
                16,
                green,
                true
            )

            label(
                "${job.client} — ${job.type}\n" +
                "${job.item}\n" +
                "${job.address}",
                13,
                Color.WHITE
            )

            btn("OPEN / EDIT") {
                form(job.type, job)
            }
        }

        btn("BACK") {
            home()
        }
    }

    private fun message(job: Job): String {

        return if (job.type == "Installation") {

            """
Good day ${job.client},

This is a friendly reminder from I.D.T. Steelworks & Engineering regarding your upcoming installation.

Date: ${job.date}
Time: ${job.time}
Address: ${job.address}
Project: ${job.item}

Kindly confirm that the scheduled date and time are convenient for you.

Regards,
I.D.T. Steelworks & Engineering
            """.trimIndent()

        } else {

            """
Good day ${job.client},

Your items are ready for collection.

Items: ${job.item}

Please let us know when you would like to arrange collection.

Thank you for choosing I.D.T. Steelworks & Engineering.

Regards,
I.D.T. Steelworks & Engineering
            """.trimIndent()
        }
    }

    private fun whatsapp(job: Job) {
        try {
            val url = Uri.parse(
                "https://wa.me/${job.phone}?text=" +
                Uri.encode(message(job))
            )

            startActivity(
                Intent(Intent.ACTION_VIEW, url)
            )

        } catch (e: Exception) {
            toast("WhatsApp unavailable")
        }
    }

    private fun scheduleReminder(
        job: Job,
        date: String,
        time: String,
        hoursBefore: Int,
        title: String,
        body: String
    ) {
        try {
            val formatter = SimpleDateFormat(
                "yyyy-MM-dd HH:mm",
                Locale.US
            )

            formatter.isLenient = false

            val reminderTime = formatter
                .parse("$date $time")!!
                .time - hoursBefore * 60L * 60L * 1000L

            if (reminderTime < System.currentTimeMillis()) {
                return
            }

            val intent = Intent(
                this,
                ReminderReceiver::class.java
            ).apply {
                putExtra("title", title)
                putExtra("body", body)
            }

            val pendingIntent = PendingIntent.getBroadcast(
                this,
                (job.id + title).hashCode(),
                intent,
                PendingIntent.FLAG_UPDATE_CURRENT or
                    PendingIntent.FLAG_IMMUTABLE
            )

            val alarmManager =
                getSystemService(ALARM_SERVICE) as AlarmManager

            if (
                Build.VERSION.SDK_INT >= 31 &&
                alarmManager.canScheduleExactAlarms()
            ) {
                alarmManager.setExactAndAllowWhileIdle(
                    AlarmManager.RTC_WAKEUP,
                    reminderTime,
                    pendingIntent
                )
            } else {
                alarmManager.setAndAllowWhileIdle(
                    AlarmManager.RTC_WAKEUP,
                    reminderTime,
                    pendingIntent
                )
            }

        } catch (e: Exception) {
            toast("Use date YYYY-MM-DD and time HH:MM")
        }
    }

    private fun toast(text: String) {
        Toast.makeText(
            this,
            text,
            Toast.LENGTH_LONG
        ).show()
    }
}
